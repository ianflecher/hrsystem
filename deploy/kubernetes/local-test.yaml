apiVersion: v1
kind: Namespace
metadata:
  name: imprint-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: imprint-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: imprint-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: hris
            - name: MYSQL_USER
              value: hris
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: imprint-test
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hris-data
  namespace: imprint-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: production-data-v2
  namespace: imprint-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marketing-data-v2
  namespace: imprint-test
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hris
  namespace: imprint-test
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: hris
  template:
    metadata:
      labels:
        app: hris
    spec:
      containers:
        - name: hris
          image: localhost:5000/imprint/hris:central-admin-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: APP_ENV
              value: local
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: http://localhost:30080
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: app-keys
                  key: hris
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: hris
            - name: DB_USERNAME
              value: hris
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: SESSION_DRIVER
              value: database
            - name: CACHE_STORE
              value: database
            - name: QUEUE_CONNECTION
              value: database
            - name: FILESYSTEM_DISK
              value: local
            - name: CENTRAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: central-admin-internal
                  key: token
          volumeMounts:
            - name: data
              mountPath: /var/www/html/database/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hris-data
---
apiVersion: v1
kind: Service
metadata:
  name: hris
  namespace: imprint-test
spec:
  type: NodePort
  selector:
    app: hris
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production
  namespace: imprint-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production
  template:
    metadata:
      labels:
        app: production
    spec:
      initContainers:
        - name: initialize-database-file
          image: localhost:5000/imprint/production:central-admin-v2
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "touch /data/imprint.sqlite"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: production
          image: localhost:5000/imprint/production:central-admin-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: APP_ENV
              value: local
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: http://localhost:30081
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: app-keys
                  key: production
            - name: DB_CONNECTION
              value: sqlite
            - name: DB_DATABASE
              value: /var/www/html/database/imprint.sqlite
            - name: SESSION_DRIVER
              value: file
            - name: CACHE_STORE
              value: file
            - name: QUEUE_CONNECTION
              value: sync
            - name: FILESYSTEM_DISK
              value: local
            - name: CENTRAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: central-admin-internal
                  key: token
            - name: PORT
              value: "10000"
          volumeMounts:
            - name: data
              mountPath: /var/www/html/database/imprint.sqlite
              subPath: imprint.sqlite
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: production-data-v2
---
apiVersion: v1
kind: Service
metadata:
  name: production
  namespace: imprint-test
spec:
  type: NodePort
  selector:
    app: production
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing
  namespace: imprint-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketing
  template:
    metadata:
      labels:
        app: marketing
    spec:
      initContainers:
        - name: initialize-database-file
          image: localhost:5000/imprint/marketing:central-admin-v2
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "touch /data/database.sqlite"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: marketing
          image: localhost:5000/imprint/marketing:central-admin-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: APP_ENV
              value: local
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: http://localhost:30082
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: app-keys
                  key: marketing
            - name: DB_CONNECTION
              value: sqlite
            - name: DB_DATABASE
              value: /var/www/html/database/database.sqlite
            - name: SESSION_DRIVER
              value: file
            - name: CACHE_STORE
              value: file
            - name: QUEUE_CONNECTION
              value: sync
            - name: FILESYSTEM_DISK
              value: local
            - name: CENTRAL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: central-admin-internal
                  key: token
            - name: PORT
              value: "10000"
          volumeMounts:
            - name: data
              mountPath: /var/www/html/database/database.sqlite
              subPath: database.sqlite
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marketing-data-v2
---
apiVersion: v1
kind: Service
metadata:
  name: marketing
  namespace: imprint-test
spec:
  type: NodePort
  selector:
    app: marketing
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-admin
  namespace: imprint-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-admin
  template:
    metadata:
      labels:
        app: central-admin
    spec:
      containers:
        - name: central-admin
          image: localhost:5000/imprint/central-admin:central-admin-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 10000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: PORT
              value: "10000"
            - name: CENTRAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: central-admin-credentials
                  key: username
            - name: CENTRAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: central-admin-credentials
                  key: password
            - name: CENTRAL_ADMIN_HRIS_URL
              value: http://localhost:30080
            - name: CENTRAL_ADMIN_HRIS_HEALTH_URL
              value: http://hris:10000
            - name: CENTRAL_ADMIN_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: central-admin-internal
                  key: token
            - name: CENTRAL_ADMIN_PRODUCTION_URL
              value: http://localhost:30081
            - name: CENTRAL_ADMIN_PRODUCTION_HEALTH_URL
              value: http://production:10000
            - name: CENTRAL_ADMIN_MARKETING_URL
              value: http://localhost:30082
            - name: CENTRAL_ADMIN_MARKETING_HEALTH_URL
              value: http://marketing:10000
---
apiVersion: v1
kind: Service
metadata:
  name: central-admin
  namespace: imprint-test
spec:
  type: NodePort
  selector:
    app: central-admin
  ports:
    - port: 10000
      targetPort: 10000
      nodePort: 30083
